name: Build Spider Night APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download game
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp multiplayer.js www/

          npm init -y

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          npx cap init "Spider Night" "com.spidernight.game" --web-dir www

          npx cap add android

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<manifest",
                  '<manifest\n    xmlns:android="http://schemas.android.com/apk/res/android"',
                  1
              ) if "xmlns:android=" not in s else s
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )

          s = s.replace(
              "<activity",
              '<activity android:screenOrientation="sensorLandscape"',
              1
          )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Night-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
