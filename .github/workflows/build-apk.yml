
name: Build Spider Night APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract game archives
        run: |
          mkdir -p extracted

          find . -type f -iname "*.zip" \
            -not -path "./extracted/*" \
            -not -path "./node_modules/*" \
            -print0 | while IFS= read -r -d '' file; do
              echo "Extracting: $file"
              unzip -o "$file" -d extracted
            done

      - name: Locate game
        run: |
          GAME=$(find . -type f -name index.html \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" | head -n 1)

          if [ -z "$GAME" ]; then
            echo "ERROR: No index.html found!"
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          GAME_DIR=$(dirname "$GAME")
          echo "GAME_DIR=$GAME_DIR" >> $GITHUB_ENV
          echo "Game found: $GAME"

      - name: Prepare Capacitor
        run: |
          mkdir -p www
          cp -R "$GAME_DIR"/. www/

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          npx cap init "Spider Night" "com.spidernight.game" --web-dir www
          npx cap add android

      - name: Apply app icon
        run: |
          python3 -m pip install pillow

          ICON=$(find . -type f -name launcher-icon.jpg | head -n 1)

          if [ -n "$ICON" ]; then
            python3 - "$ICON" <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys

          img = Image.open(sys.argv[1]).convert("RGBA")
          side = min(img.size)
          x = (img.width-side)//2
          y = (img.height-side)//2
          img = img.crop((x,y,x+side,y+side)).resize((512,512))

          for folder in Path("android/app/src/main/res").glob("mipmap-*"):
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  p = folder/name
                  if p.exists():
                      img.save(p)
          PY
          fi

      - name: Configure landscape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace(
              '<activity',
              '<activity android:screenOrientation="sensorLandscape"',
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Night-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
