name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковка архива
        run: for f in *.zip; do unzip -o "$f"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Подготовка проекта
        run: |
          mkdir www
          cp index.html multiplayer.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Spider Night" com.spidernight.game --web-dir www
          npx cap add android
      - name: Горизонтальный экран
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Сборка APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spider-night-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
